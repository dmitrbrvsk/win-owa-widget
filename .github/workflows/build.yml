name: Build

on:
  push:
    branches: [master]
  pull_request:
  # Hand-started runs exist for one case: rebuilding a version whose release is already published.
  # `republish` has to be ticked in the UI, so a push can never carry it (see the release job).
  workflow_dispatch:
    inputs:
      republish:
        description: Delete the release and tag for the version in package.json, then publish them again
        type: boolean
        default: false

# Read-only by default. Only the release job below is allowed to write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: TZ=Europe/Moscow npm test
      # The whole tree, not --omit=dev: there are no runtime dependencies at all (`npm ls --omit=dev`
      # prints "(empty)"), and Electron — the entire runtime that ships — is a devDependency, so a
      # production-only audit would check nothing. Covered: high and critical advisories anywhere in
      # the tree, Electron included. Not covered: moderate and low ones, which today are all in
      # build-time tooling that never reaches a user's machine.
      - run: npm audit --audit-level=high
      # The audit above only reports an advisory against the version that is installed, so the version
      # that was audited belongs in the log next to it.
      - name: Electron version covered by the audit
        run: node -p "require('electron/package.json').version"

  # Builds the installers. Runs the whole build toolchain over the dependency tree, so it gets no token
  # that can write; third-party install scripts stay off even here (see npm ci below).
  windows:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No dependency cache here: this job produces the files that get published, so nothing a
      # cache could carry in from another run is allowed into it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Install scripts of third-party packages do not run. Electron's own installer is started by
      # hand: it downloads the binary and checks it against the checksums shipped in the package.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run dist
      # Opens the popup, the settings, the create-meeting and the free-time windows from source on a real
      # Windows desktop and fails if any page did not render (the IPC sender check compares file paths, which differ per OS).
      - name: Smoke test the windows on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:OWA_DEMO = '1'
          $env:OWA_SMOKE_SHOT = (Resolve-Path smoke).Path + '\popup.png'
          # The app exits 0 only when all four pages rendered (see OWA_SMOKE_SHOT in src/main/index.ts).
          npx electron .
          if ($LASTEXITCODE -ne 0) { Write-Error "smoke failed with exit code $LASTEXITCODE"; exit 1 }
      # The built app, not the source tree: starts the unpacked .exe with a throwaway profile (no server
      # configured, so nothing is sent anywhere) and fails if it exits, or if the log shows a window that
      # did not load or a page the IPC check turned away (what a blank window looks like).
      - name: Start the packaged app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'owa-profile'
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"account":{"serverUrl":""}}' | Set-Content -Path (Join-Path $data 'settings.json') -Encoding utf8
          $exe = (Resolve-Path 'release/win-unpacked/OWA Widget.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList "--user-data-dir=$data" -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          $log = Get-ChildItem -Path $data -Recurse -Filter 'owa-widget.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName } else { Write-Host 'no log file found' }
          Get-Process -Name 'OWA Widget' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { Write-Error 'the packaged app exited'; exit 1 }
          if (-not $log) { Write-Error 'the packaged app wrote no log'; exit 1 }
          $text = Get-Content $log.FullName -Raw
          if ($text -notmatch 'start: OWA Widget') { Write-Error 'no start entry in the log'; exit 1 }
          if ($text -match 'page failed to load|renderer gone|preload error|ipc: rejected|uncaught|unhandled') { Write-Error 'the log reports a failure'; exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/*.png
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Checksums
        shell: bash
        working-directory: release
        run: sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OWA-Widget-windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt

  # Publishes a release when master carries a version that has none yet, or replaces one on a
  # hand-started republish run. It builds nothing and runs no project code: it only takes the
  # finished files from the job above.
  release:
    needs: windows
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OWA-Widget-windows
          path: release
      # Deleting a published release is destructive, so it takes a run a person started by hand with
      # the `republish` box ticked: a push carries no inputs at all and so can never reach this step,
      # which keeps the automatic path unable to touch anything that is already out.
      - name: Replace the release for this version
        if: github.event_name == 'workflow_dispatch' && inputs.republish == true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            # The tag goes with it: the next step would otherwise publish onto a tag pointing at the old commit.
            gh release delete "v${VERSION}" --cleanup-tag -y
          else
            echo "no release v${VERSION} to replace"
          fi
      - name: Does the release exist already?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Verify the checksums
        if: steps.rel.outputs.exists == 'false'
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      # Lets anyone check that a published file was built from this repository by this workflow:
      #   gh attestation verify OWA-Widget-Setup-<version>.exe --repo dmitrbrvsk/win-owa-widget
      # SHA256SUMS.txt is attested as well, because it is what the install instructions tell people to
      # compare their download against: an unsigned list of hashes vouches for nothing.
      - name: Attest build provenance
        if: steps.rel.outputs.exists == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }} # the tag points at the commit that was built, not at the default branch
          name: OWA Widget ${{ needs.windows.outputs.version }}
          generate_release_notes: false
          body: |
            Встречи из Exchange / OWA в трее Windows: таймлайн дня, подключение к звонку одним нажатием, напоминания и уведомления с кнопками, ответы на приглашения (в том числе с комментарием), заметки к встречам, поиск по встречам, создание встреч и поиск свободного времени. Подробности и F.A.Q. — в [README](https://github.com/dmitrbrvsk/win-owa-widget#readme), модель безопасности — в [SECURITY.md](https://github.com/dmitrbrvsk/win-owa-widget/blob/master/SECURITY.md).

            ## Установка
            - **OWA-Widget-Setup-${{ needs.windows.outputs.version }}.exe** — установщик (Windows 10/11, x64; на ARM64 работает в эмуляции). Ставится для текущего пользователя, права администратора не нужны.
            - **OWA-Widget-Setup-${{ needs.windows.outputs.version }}-arm64.exe** — тот же установщик, собранный для Windows на ARM64.
            - **OWA-Widget-${{ needs.windows.outputs.version }}-portable-x64.zip** — без установки: распакуйте в любую папку и запустите `OWA Widget.exe`. Во временные папки ничего не пишется.

            ## Как проверить, что файл настоящий
            Установщик пока не подписан сертификатом Windows, поэтому SmartScreen может показать «Windows защитила ваш компьютер». Прежде чем нажимать «Выполнить в любом случае», сверьте файл:
            - **Контрольная сумма.** В PowerShell: `Get-FileHash .\OWA-Widget-Setup-${{ needs.windows.outputs.version }}.exe -Algorithm SHA256` — результат должен совпасть со строкой в `SHA256SUMS.txt` из этого релиза.
            - **Происхождение сборки.** `gh attestation verify .\OWA-Widget-Setup-${{ needs.windows.outputs.version }}.exe --repo dmitrbrvsk/win-owa-widget` подтверждает, что файл собран из этого репозитория workflow'ом GitHub Actions.
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
