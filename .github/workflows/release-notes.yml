name: Release notes

on:
  push:
    branches: [master]
    paths:
      - 'docs/releases/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # No dependency installation or project code runs with this token. Markdown is JSON data.
      # Only an existing published release's body is patched: tags, dates and assets are untouched.
      - name: Sync descriptions of published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | [.tag_name, .id] | @tsv' > "$RUNNER_TEMP/releases.tsv"
          while IFS=$'\t' read -r tag id; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || continue
            [[ "$id" =~ ^[0-9]+$ ]] || exit 1
            notes="docs/releases/$tag.md"
            [[ -f "$notes" ]] || continue
            if [[ ! -s "$notes" ]]; then
              echo "Empty release notes: $notes" >&2
              exit 1
            fi
            gh api "repos/$GH_REPO/releases/$id" > "$RUNNER_TEMP/current-release.json"
            if jq -e --rawfile body "$notes" '.body == $body' "$RUNNER_TEMP/current-release.json" >/dev/null; then
              echo "$tag: already current"
              continue
            fi
            jq -n --rawfile body "$notes" '{body: $body}' > "$RUNNER_TEMP/release-body.json"
            gh api --method PATCH "repos/$GH_REPO/releases/$id" \
              --input "$RUNNER_TEMP/release-body.json" --silent
            echo "$tag: description updated"
          done < "$RUNNER_TEMP/releases.tsv"
