nodeLinker: node-modules
enableScripts: false
enableTelemetry: false
npmRegistryServer: "https://registry.npmjs.org"
# This project builds NSIS installers; Squirrel is an unused optional target.
packageExtensions:
  "app-builder-lib@26.15.3":
    peerDependenciesMeta:
      electron-builder-squirrel-windows:
        optional: true
# Installed braces and sprintf-js have tested local security patches.
# Remove each exception with its upstream fix (see .yarn/patches/README.md).
npmAuditIgnoreAdvisories:
  - "1240992"
  - "1241202"
