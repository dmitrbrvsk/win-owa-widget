appId: com.dmitrbrvsk.owawidget
productName: OWA Widget
copyright: Copyright © 2026 Dmitry Borovskiy
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.txt
  - "!dist/mcp/**/*"
  - "!**/*.map"
extraResources:
  - from: dist/mcp
    to: mcp
    filter: ["*.cjs", "THIRD_PARTY_NOTICES.txt"]
# Switch off what an attacker could use to turn the app into a general-purpose Node runtime.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
  # The app code is checked against a hash inside the .exe: a changed app.asar does not start.
  enableEmbeddedAsarIntegrityValidation: true
  # The UI is served from owa-widget://app, so file:// needs no extra privileges.
  grantFileProtocolExtraPrivileges: false
# Only the languages the app speaks: the other fifty Chromium translation files are dead weight.
electronLanguages: [ru, en-US, en-GB]
win:
  # Which installers and which architectures are chosen on the command line (see "dist" in package.json):
  # x64 gets the installer and the portable zip, ARM64 gets an installer of its own. They are kept apart
  # because a list of targets here would be merged into the ARM64 config and build both into one file.
  # A plain zip: unpack once, run from the folder. (The NSIS "portable" target re-extracts the
  # whole app into %TEMP% on every launch and leaves the folder behind if the app is killed.)
  artifactName: OWA-Widget-${version}-portable-${arch}.${ext}
  icon: build/icon.ico
  # Never ask for administrator rights: the app lives in the user's profile.
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: OWA-Widget-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: OWA Widget
  # Uninstalling removes the saved settings, the encrypted password and cache, and the log (an update keeps them).
  deleteAppDataOnUninstall: true
