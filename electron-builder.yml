appId: com.dmitrbrvsk.owawidget
productName: OWA Widget
copyright: Copyright © 2026 Dmitry Borovskiy
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
# Switch off what an attacker could use to turn the app into a general-purpose Node runtime.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  # Never ask for administrator rights: the app lives in the user's profile.
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: OWA-Widget-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: OWA Widget
portable:
  artifactName: OWA-Widget-${version}-portable.${ext}
