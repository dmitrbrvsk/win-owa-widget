<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- This is the policy that ships. The dev server loosens connect-src in vite.config.ts so that a
         broken rewrite there costs a working `npm run dev`, not a page that may talk to the network. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>OWA Widget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
